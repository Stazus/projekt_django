<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rejestracja</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            margin: 30px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
        }

        label {
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 20px;
        }

        .helptext {
            color: #666;
            font-size: 0.9em;
        }

        .errorlist {
            color: red;
        }

        a {
            text-decoration: none;
        }


        * {
            box-sizing: border-box;
        }

        h1 {
            overflow-wrap: anywhere;
        }

        button {
            border: 0;
            border-radius: 5px;
            background: #0d6efd;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .errorlist,
        .error,
        .helptext {
            overflow-wrap: anywhere;
        }

        @media (max-width: 700px) {
            body {
                margin: 0;
            }

            .container {
                width: 100%;
                min-height: 100vh;
                max-width: none;
                padding: 18px;
                border-radius: 0;
            }

            h1 {
                font-size: 1.7rem;
            }

            input,
            button {
                font-size: 16px;
            }

            button {
                width: 100%;
                padding: 12px;
            }

            .back-link {
                display: block;
                width: 100%;
                padding: 10px;
                text-align: center;
                background: #e9ecef;
                border-radius: 6px;
            }
        }

    </style>
</head>
<body>

<div class="container">

    <p>
        <a href="{% url 'home' %}" class="back-link">← Wróć do strony głównej</a>
    </p>

    <h1>Rejestracja użytkownika</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">
            Zarejestruj się
        </button>
    </form>

</div>

</body>
</html>

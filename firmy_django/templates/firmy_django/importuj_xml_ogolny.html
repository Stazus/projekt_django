<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ogólny import XML</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            background: #f7f7f7;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            padding: 25px;
            background: #fff;
            border-radius: 8px;
        }

        h1 {
            margin-top: 0;
            overflow-wrap: anywhere;
        }

        .description,
        .message {
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .description {
            margin-bottom: 22px;
        }

        .message {
            margin: 18px 0;
            padding: 14px;
            background: #eef6ff;
            border: 1px solid #b7d7ff;
            border-radius: 6px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="file"] {
            width: 100%;
            max-width: 100%;
            padding: 10px;
            border: 1px solid #aaa;
            border-radius: 4px;
            background: #fff;
            font: inherit;
        }

        button {
            margin-top: 18px;
            padding: 11px 18px;
            border: 0;
            border-radius: 5px;
            background: #0d6efd;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #1565c0;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            body {
                padding: 0;
            }

            .container {
                min-height: 100vh;
                padding: 18px;
                border-radius: 0;
            }

            h1 {
                font-size: 1.6rem;
            }

            button {
                width: 100%;
                padding: 12px;
            }

            .back-link {
                display: block;
                width: 100%;
                text-align: center;
                padding: 10px;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Ogólny import XML</h1>

        <p class="description">
            Wybierz plik XML pobrany z PRS. Aplikacja odczyta dane firmy,
            sprawdzi, czy firma istnieje już w bazie i zdecyduje,
            czy dodać nowe sprawozdanie albo utworzyć nową firmę.
        </p>

        {% if komunikat %}
            <div class="message">
                <strong>{{ komunikat }}</strong>
            </div>
        {% endif %}

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <label for="plik_xml">Wybierz plik XML:</label>
            <input
                type="file"
                id="plik_xml"
                name="plik_xml"
                accept=".xml"
            >

            <button type="submit">
                Importuj XML
            </button>
        </form>

        <a href="{% url 'home' %}" class="back-link">
            ← Powrót do listy firm
        </a>
    </main>
</body>
</html>

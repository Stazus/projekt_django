<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edytuj profil firmy</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f7f7f7;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
        }

        input,
        textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 18px;
        }

        a {
            text-decoration: none;
            color: #1565c0;
            font-weight: bold;
        }


        * {
            box-sizing: border-box;
        }

        h1 {
            overflow-wrap: anywhere;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        select,
        input[type="file"] {
            width: 100%;
            max-width: 100%;
            margin-top: 5px;
            margin-bottom: 15px;
            font: inherit;
        }

        input[type="file"] {
            padding: 8px;
            border: 1px solid #aaa;
            border-radius: 4px;
            background: white;
        }

        textarea {
            min-height: 140px;
            resize: vertical;
        }

        button {
            border: 0;
            border-radius: 5px;
            background: #198754;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .errorlist {
            color: #b00020;
        }

        @media (max-width: 700px) {
            body {
                margin: 0;
            }

            .container {
                width: 100%;
                min-height: 100vh;
                padding: 18px;
                border-radius: 0;
            }

            h1 {
                font-size: 1.6rem;
            }

            button {
                width: 100%;
                padding: 12px;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <p>
        <a href="{% url 'szczegoly_firmy' firma.id %}">
            ← Wróć do szczegółów firmy
        </a>
    </p>

    <h1>Profil firmy: {{ firma.nazwa }}</h1>

    <form method="post" enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Zapisz profil
        </button>

    </form>

</div>

</body>
</html>

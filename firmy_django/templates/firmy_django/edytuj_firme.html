<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edytuj firmę</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            background: #f7f7f7;
            font-family: Arial, sans-serif;
        }

        .form-container {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            padding: 25px;
            background: #fff;
            border-radius: 8px;
        }

        h1 {
            margin-top: 0;
        }

        form p {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            max-width: 100%;
            padding: 10px;
            border: 1px solid #aaa;
            border-radius: 4px;
            font: inherit;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            padding: 10px 18px;
            border: 0;
            border-radius: 5px;
            background: #198754;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }

        .back-link {
            display: inline-block;
            margin-top: 18px;
            color: #1565c0;
            text-decoration: none;
            font-weight: bold;
        }

        .errorlist {
            margin: 6px 0;
            padding-left: 20px;
            color: #b00020;
        }

        @media (max-width: 768px) {
            body {
                padding: 0;
            }

            .form-container {
                min-height: 100vh;
                padding: 18px;
                border-radius: 0;
            }

            button {
                width: 100%;
                padding: 12px;
            }

            .back-link {
                display: block;
                width: 100%;
                padding: 10px;
                text-align: center;
            }
        }

        input[type="checkbox"] {
            width: auto;
            max-width: none;
            margin: 0;
            padding: 0;
        }

        form p > div label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            font-weight: bold;
        }

    </style>
</head>

<body>
    <main class="form-container">
        <h1>Edytuj firmę</h1>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Zapisz zmiany
            </button>
        </form>

        <a href="{% url 'szczegoly_firmy' firma.id %}" class="back-link">
            ← Wróć do szczegółów firmy
        </a>
    </main>
</body>
</html>
